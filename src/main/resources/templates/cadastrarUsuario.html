<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            margin: 40px auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .card-header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .card-header p {
            font-size: 15px;
            opacity: 0.9;
        }

        .card-body {
            padding: 35px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #2196F3;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.2);
        }

        .btn-cadastrar {
            width: 100%;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-cadastrar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4);
        }

        .btn-voltar {
            display: inline-block;
            width: 100%;
            text-align: center;
            margin-top: 18px;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            color: #555;
            transition: background 0.2s;
        }

        .btn-voltar:hover {
            background: #f5f5f5;
            color: #222;
        }

        @media(max-width: 600px){

            .card-header h1 {
                font-size: 24px;
            }

            .card-body {
                padding: 25px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="card-header">
            <h1>Cadastro de Usuário</h1>

            <p>
                Preencha as informações abaixo
            </p>
        </div>

        <div class="card-body">

            <form th:action="@{/usuarios/ui/salvar}"
                  th:object="${usuario}"
                  method="post">

                <div class="form-group">
                    <label for="nome">Nome</label>

                    <input type="text"
                           id="nome"
                           th:field="*{nome}"
                           placeholder="Digite o nome do usuário"
                           required>
                </div>

                <div class="form-group">
                    <label for="idade">Idade</label>

                    <input type="number"
                           id="idade"
                           th:field="*{idade}"
                           placeholder="Digite a idade"
                           min="0"
                           required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>

                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           placeholder="Digite o e-mail"
                           required>
                </div>

                <div class="form-group">
                    <label for="cpf">CPF</label>

                    <input type="text"
                           id="cpf"
                           th:field="*{cpf}"
                           placeholder="Digite o CPF"
                           required>
                </div>

                <button type="submit"
                        class="btn-cadastrar">
                    Cadastrar Usuário
                </button>

            </form>

            <a th:href="@{/usuarios/ui/listar}"
               class="btn-voltar">
                ← Voltar para lista de usuários
            </a>

        </div>

    </div>

</div>

<script>

    const cpfInput = document.getElementById("cpf");

    cpfInput.addEventListener("input", function () {

        let valor = cpfInput.value.replace(/\D/g, "");

        valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
        valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
        valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

        cpfInput.value = valor;

    });

</script>

</body>

</html>
