<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuário</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Segoe UI', Arial, sans-serif;
            background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height:100vh;
            padding:20px;
        }

        .container{
            max-width:750px;
            margin:30px auto;
        }

        .card{
            background:white;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 20px 60px rgba(0,0,0,0.3);
        }

        .card-header{
            background:linear-gradient(135deg, #2196F3, #1565C0);
            color:white;
            padding:35px;
            text-align:center;
        }

        .card-header h1{
            font-size:32px;
            margin-bottom:10px;
        }

        .card-header p{
            font-size:15px;
            opacity:0.9;
        }

        .card-body{
            padding:35px;
        }

        .info-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
        }

        .info-card{
            background:#f8f9fa;
            padding:20px;
            border-radius:14px;
            border-left:5px solid #2196F3;
            transition:0.3s;
        }

        .info-card:hover{
            transform:translateY(-3px);
            box-shadow:0 10px 25px rgba(0,0,0,0.08);
        }

        .info-label{
            font-size:13px;
            color:#666;
            margin-bottom:8px;
            text-transform:uppercase;
            font-weight:bold;
        }

        .info-value{
            width:100%;
            border:none;
            background:transparent;
            font-size:22px;
            color:#222;
            font-weight:bold;
            outline:none;
            word-break:break-word;
        }

        .button-group{
            display:flex;
            gap:15px;
            margin-top:35px;
        }

        .btn{
            flex:1;
            padding:14px;
            border:none;
            border-radius:12px;
            font-size:16px;
            font-weight:bold;
            text-decoration:none;
            text-align:center;
            transition:0.3s;
            cursor:pointer;
        }

        .btn-voltar{
            background:linear-gradient(135deg,#607D8B,#455A64);
            color:white;
        }

        .btn-voltar:hover{
            transform:translateY(-2px);
            box-shadow:0 5px 20px rgba(96,125,139,0.4);
        }

        .btn-editar{
            background:linear-gradient(135deg,#FF9800,#F57C00);
            color:white;
        }

        .btn-editar:hover{
            transform:translateY(-2px);
            box-shadow:0 5px 20px rgba(255,152,0,0.4);
        }

        .btn-excluir{
            background:linear-gradient(135deg,#f44336,#d32f2f);
            color:white;
        }

        .btn-excluir:hover{
            transform:translateY(-2px);
            box-shadow:0 5px 20px rgba(244,67,54,0.4);
        }

        @media(max-width:700px){

            .info-grid{
                grid-template-columns:1fr;
            }

            .button-group{
                flex-direction:column;
            }

            .card-header h1{
                font-size:26px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="card-header">
            <h1>Editar Usuário</h1>

            <p>
                Atualize as informações do usuário cadastrado
            </p>
        </div>

        <div class="card-body">

            <form th:action="@{/usuarios/ui/atualizar/{id}(id=${usuario.id})}"
                  th:object="${usuario}"
                  method="post">

                <!-- Campo oculto para manter o ID -->
                <input type="hidden" th:field="*{id}">

                <div class="info-grid">

                    <div class="info-card">
                        <div class="info-label">
                            NOME
                        </div>

                        <input type="text"
                               th:field="*{nome}"
                               class="info-value"
                               required>
                    </div>

                    <div class="info-card">
                        <div class="info-label">
                            IDADE
                        </div>

                        <input type="number"
                               th:field="*{idade}"
                               min="0"
                               class="info-value"
                               required>
                    </div>

                    <div class="info-card">
                        <div class="info-label">
                            EMAIL
                        </div>

                        <input type="email"
                               th:field="*{email}"
                               class="info-value"
                               required>
                    </div>

                    <div class="info-card">
                        <div class="info-label">
                            CPF
                        </div>

                        <input type="text"
                               th:field="*{cpf}"
                               class="info-value"
                               required>
                    </div>

                </div>

                <div class="button-group">

                    <a th:href="@{/usuarios/ui/listar}"
                       class="btn btn-voltar">
                        Voltar
                    </a>

                    <button type="submit"
                            class="btn btn-editar">
                        Salvar Alterações
                    </button>

                    <a th:href="@{/usuarios/ui/deletar/{id}(id=${usuario.id})}"
                       class="btn btn-excluir">
                        Excluir
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script>

    const cpfInput = document.getElementById("cpf");

    cpfInput.addEventListener("input", function () {

        let valor = cpfInput.value.replace(/\D/g, "");

        valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
        valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
        valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

        cpfInput.value = valor;

    });

</script>

</body>

</html>
